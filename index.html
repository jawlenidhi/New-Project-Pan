<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Project Pan 🌸</title>
<meta name="theme-color" content="#f6d6ee">
<meta name="description" content="A cute project pan tracker for makeup and skincare">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌸%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
/* ================= THEME ================= */
:root{
  --bg1:#fff0f7;--bg2:#f3e8ff;--bg3:#e8ecff;
  --card:rgba(255,255,255,.88);--card-solid:#fff;
  --text:#43264f;--muted:#7d6390;--line:rgba(160,110,200,.22);
  --pink:#ff8fc7;--pink-d:#b0307f;--lav:#b99cf5;--purple:#7b5be0;--purple-d:#5b3fb8;
  --grad:linear-gradient(135deg,#a24fcf,#7b5be0);
  --grad-soft:linear-gradient(135deg,#ffd6ec,#e5d4ff);
  --ok:#2f8f6a;--warn:#a8590b;--bad:#b3261e;
  --shadow:0 8px 24px rgba(160,100,210,.18);--shadow-s:0 3px 10px rgba(160,100,210,.14);
  --r:20px;--nav:68px;
}
[data-theme=dark]{
  --bg1:#1b1229;--bg2:#241a3d;--bg3:#1d2040;
  --card:rgba(52,38,86,.92);--card-solid:#342656;
  --text:#f4eaff;--muted:#c6b3e3;--line:rgba(200,170,250,.22);
  --pink:#ff9ed0;--pink-d:#ffa6d4;--lav:#b99cf5;--purple:#a98bff;--purple-d:#cbb8ff;
  --grad:linear-gradient(135deg,#9a55d6,#6f55df);
  --grad-soft:linear-gradient(135deg,#4a2c6b,#3a2f73);
  --ok:#6fe0b0;--warn:#ffc27a;--bad:#ff9a92;
  --shadow:0 8px 24px rgba(0,0,0,.35);--shadow-s:0 3px 10px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Nunito','Quicksand',ui-rounded,'SF Pro Rounded',system-ui,sans-serif;font-weight:600;color:var(--text);
  background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3)) fixed;min-height:100dvh;line-height:1.45;
  padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 24px)}
body.noscroll{overflow:hidden}
h1,h2,h3{margin:0;font-weight:900;line-height:1.2}
h1{font-size:1.6rem}h2{font-size:1.2rem}h3{font-size:1.02rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--purple-d)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px;border-radius:12px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
/* header */
.top{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:linear-gradient(var(--bg1),transparent);
  padding:calc(env(safe-area-inset-top) + 10px) 0 8px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:900;font-size:1.25rem;display:flex;gap:8px;align-items:center}
.brand span.s{display:inline-block;animation:twinkle 3s ease-in-out infinite}
.iconbtn{width:46px;height:46px;border-radius:50%;background:var(--card);box-shadow:var(--shadow-s);font-size:1.2rem;display:grid;place-items:center}
#view{padding-top:8px;animation:fade .28s ease both;min-height:60vh}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.25) rotate(15deg)}}
/* cards & basics */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:14px 0;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrapx{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.small{font-size:.86rem}.center{text-align:center}
.btn{min-height:48px;padding:0 20px;border-radius:999px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--grad);color:#fff;box-shadow:var(--shadow-s);transition:transform .12s,box-shadow .12s}
.btn:active{transform:scale(.96)}
.btn.soft{background:var(--grad-soft);color:var(--text);box-shadow:none;border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--purple-d);box-shadow:none;border:2px solid var(--line)}
.btn.danger{background:#b3261e;color:#fff}
.btn.sm{min-height:40px;padding:0 14px;font-size:.9rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:800;background:var(--grad-soft);border:1px solid var(--line);white-space:nowrap}
.chip.warn{background:#ffe9c9;color:#7a3f00;border-color:#f0c78a}.chip.bad{background:#ffd9d6;color:#8a1b14;border-color:#f0a8a2}
.chip.ok{background:#d7f5e8;color:#16573f;border-color:#9fdcc0}.chip.gift{background:#ffe0f0;color:#8f1f62;border-color:#f6a9d1}
.chip.est{background:#efe3ff;color:#5b3fb8;border-color:#cdb5f5}
[data-theme=dark] .chip.warn,[data-theme=dark] .chip.bad,[data-theme=dark] .chip.ok,[data-theme=dark] .chip.gift,[data-theme=dark] .chip.est{filter:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;min-height:40px;padding:0 16px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-weight:800}
.fchip[aria-pressed=true]{background:var(--grad);color:#fff;border-color:transparent}
.sec{display:flex;align-items:center;justify-content:space-between;margin:26px 0 6px}
/* photos */
.thumb{aspect-ratio:1/1;width:100%;border-radius:16px;object-fit:contain;background:var(--grad-soft);display:block}
.ph{display:grid;place-items:center;font-size:2.4rem}
/* empty */
.empty{text-align:center;padding:36px 20px;margin:16px 0}
.empty .big{font-size:3.4rem;display:block;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.empty p{margin:8px auto 18px;max-width:30ch;color:var(--muted)}
/* grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.pcard{display:block;width:100%;text-align:left;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:10px;border:1px solid var(--line);text-decoration:none;color:inherit;transition:transform .15s}
.pcard:active{transform:scale(.97)}
.pcard .nm{font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:8px}
.pcard .sub{font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:10px;border-radius:99px;background:var(--grad-soft);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--purple));transition:width .5s}
/* today basket */
.bcard{position:relative;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background:var(--card);border-radius:24px;padding:10px;box-shadow:var(--shadow);border:2px solid transparent;cursor:pointer;transition:transform .15s,border-color .2s;text-align:center}
.bcard.used{border-color:var(--pink)}
.bcard:active{transform:scale(.98)}
.bcard.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.07) rotate(-1.5deg)}60%{transform:scale(.97)}100%{transform:scale(1)}}
.bcard .cnt{position:absolute;top:14px;right:14px;min-width:34px;height:34px;padding:0 9px;border-radius:99px;background:var(--grad);color:#fff;font-weight:900;display:grid;place-items:center;box-shadow:var(--shadow-s)}
.bcard .cnt.zero{background:var(--card-solid);color:var(--muted);border:1px solid var(--line)}
.bcard .info{position:absolute;top:10px;left:10px;width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:1rem;box-shadow:var(--shadow-s);z-index:2;text-decoration:none}
.bcard .nm{font-weight:900;margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{font-size:.78rem;color:var(--muted)}
.heart{position:fixed;z-index:90;pointer-events:none;font-size:1.4rem;animation:rise .9s ease-out forwards}
@keyframes rise{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:95;width:100%;height:100%}
.done{background:var(--grad-soft);text-align:center;border-radius:var(--r);padding:16px;font-weight:900;margin:14px 0;border:1px solid var(--line)}
.dragging{opacity:.6;transform:scale(1.02);box-shadow:var(--shadow)}
.handle{touch-action:none;width:44px;height:44px;display:grid;place-items:center;font-size:1.3rem;cursor:grab;user-select:none}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:6px 10px calc(env(safe-area-inset-bottom) + 6px);
  background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(160,100,210,.14)}
.nav .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.nav a{min-height:56px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.72rem;font-weight:900;text-decoration:none;color:var(--muted);gap:1px}
.nav a .e{font-size:1.35rem;transition:transform .2s}
.nav a[aria-current=page]{background:var(--grad-soft);color:var(--text)}
.nav a[aria-current=page] .e{transform:scale(1.2)}
.fab{position:fixed;right:max(16px,calc(50% - 344px));bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 16px);z-index:25;height:58px;padding:0 22px;border-radius:99px;font-size:1rem}
/* ring */
.ringwrap{position:relative;width:132px;height:132px;flex:none}
.ringwrap svg{transform:rotate(-90deg)}
.ringwrap .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:900;line-height:1.1}
.stat{background:var(--grad-soft);border-radius:16px;padding:12px;text-align:center;border:1px solid var(--line)}
.stat b{display:block;font-size:1.35rem;font-weight:900}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}.kv:last-child{border:0}
.kv span:first-child{color:var(--muted)}.kv span:last-child{text-align:right;font-weight:800;overflow-wrap:anywhere}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}
.long{overflow-wrap:anywhere}
/* forms */
label.l{display:block;font-weight:800;margin:14px 0 6px;font-size:.92rem}
.in,select.in,textarea.in{width:100%;min-height:50px;padding:10px 14px;border-radius:16px;border:2px solid var(--line);background:var(--card-solid);font-weight:600}
textarea.in{min-height:80px;resize:vertical}
.in:focus{border-color:var(--purple);outline:none;box-shadow:0 0 0 3px rgba(123,91,224,.25)}
.err{color:var(--bad);font-size:.84rem;font-weight:800;margin-top:4px;min-height:0}
.in.bad{border-color:var(--bad)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--grad-soft);padding:5px;border-radius:99px}
.seg button{min-height:44px;border-radius:99px;font-weight:900}
.seg button[aria-pressed=true]{background:var(--card-solid);box-shadow:var(--shadow-s)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.switch{display:flex;align-items:center;gap:10px;min-height:48px;font-weight:800}
.switch input{width:24px;height:24px;accent-color:var(--purple)}
input[type=range]{width:100%;accent-color:var(--purple);height:36px}
.stops{display:flex;justify-content:space-between;font-size:.78rem;font-weight:800;color:var(--muted)}
.stops b{color:var(--purple-d);font-weight:900}
.pre{border-radius:18px;padding:2px 14px 14px;background:var(--grad-soft);margin-top:12px;border:1px dashed var(--line)}
.prev{display:flex;gap:12px;align-items:center}
.prev .thumb{width:96px;flex:none}
/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(40,20,60,0);transition:background .2s}
.sheet-wrap[hidden]{display:none}
.sheet-wrap.open{background:rgba(40,20,60,.45)}
.sheet{width:100%;max-width:640px;max-height:92dvh;overflow:auto;background:var(--bg2);border-radius:28px 28px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 24px);transform:translateY(40px);opacity:0;transition:transform .25s,opacity .2s;box-shadow:var(--shadow)}
.sheet-wrap.open .sheet{transform:none;opacity:1}
@media(min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:28px}}
.sheet .grabber{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sticky-actions{position:sticky;bottom:-24px;background:linear-gradient(transparent,var(--bg2) 30%);padding:14px 0 4px;margin-top:10px;display:flex;gap:10px}
.sticky-actions .btn{flex:1}
/* toast */
#toasts{position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 14px);z-index:80;display:flex;justify-content:center;pointer-events:none;padding:0 16px}
.toast{pointer-events:auto;background:#3a2150;color:#fff;border-radius:99px;padding:6px 8px 6px 18px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);animation:fade .25s;font-weight:800;max-width:100%}
.toast button{color:#ffd6ec;font-weight:900;min-height:40px;padding:0 14px;border-radius:99px;background:rgba(255,255,255,.14)}
.toast.warn{background:#7a3f00}
/* badges / challenge */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:560px){.badges{grid-template-columns:repeat(4,1fr)}}
.badge{text-align:center;padding:12px 6px;border-radius:18px;background:var(--grad-soft);border:1px solid var(--line)}
.badge .e{font-size:2rem;display:block}.badge.lock{opacity:.5;filter:grayscale(1)}
.badge b{display:block;font-size:.8rem;line-height:1.2}.badge small{font-size:.7rem;color:var(--muted)}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--card-solid);border:2px dashed var(--line);font-size:.8rem}
.dot.on{background:var(--grad-soft);border:2px solid var(--pink)}
.recaps{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 14px}
.recap{flex:none;width:min(86%,320px);scroll-snap-align:center;border-radius:26px;padding:20px;color:#43264f;background:linear-gradient(155deg,#ffd1ea,#e4d2ff 60%,#d6dcff);box-shadow:var(--shadow);position:relative;overflow:hidden}
.recap h3{font-size:1.25rem}.recap .rk{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed rgba(90,50,130,.25);gap:8px}
.recap .rk b{text-align:right;overflow-wrap:anywhere}
.cat-bar{display:grid;grid-template-columns:90px 1fr 36px;gap:8px;align-items:center;margin:6px 0;font-size:.88rem}
.banner{border-radius:16px;padding:12px 14px;margin:12px 0;font-weight:800;background:#ffe9c9;color:#6b3600;border:1px solid #f0c78a}
.banner.demo{background:#efe3ff;color:#3d2a85;border-color:#cdb5f5}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><span class="s" aria-hidden="true">✨</span><span>Project Pan</span></div>
  <button class="iconbtn" data-act="theme" aria-label="Toggle dark mode" id="themeBtn">🌙</button>
</div></header>
<main class="wrap" id="view" tabindex="-1" aria-live="polite"></main>
<nav class="nav" aria-label="Main"><div class="in" id="nav"></div></nav>
<div id="toasts" role="status" aria-live="polite"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<div class="sheet-wrap" id="sheet" hidden><div class="sheet" id="sheetBody" role="dialog" aria-modal="true"></div></div>
<input type="file" id="fileImport" accept="application/json,.json" class="sr" tabindex="-1" aria-label="Import backup file">
<input type="file" id="filePhoto" accept="image/*" class="sr" tabindex="-1" aria-label="Choose product photo">
<script>
'use strict';
/* =====================================================================
   PROJECT PAN — single-file app
   Sections: 1 Utils · 2 Storage · 3 State · 4 Calculations · 5 UI helpers
             6 Photos · 7 Views · 8 Actions · 9 Backup · 10 Init
   ===================================================================== */

/* ---------- 1. UTILS (dates are always Asia/Kolkata) ---------- */
const TZ='Asia/Kolkata';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const dayFmt=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'});
const istDay=(d=new Date())=>dayFmt.format(d);               // 'YYYY-MM-DD' in IST
const dnum=s=>{const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)/864e5;};
const addDays=(s,n)=>new Date((dnum(s)+n)*864e5).toISOString().slice(0,10);
const diffDays=(a,b)=>Math.round(dnum(b)-dnum(a));
const addMonths=(s,n)=>{let[y,m,d]=s.split('-').map(Number);m+=n;y+=Math.floor((m-1)/12);m=(((m-1)%12)+12)%12+1;
  const dim=new Date(Date.UTC(y,m,0)).getUTCDate();return `${y}-${pad(m)}-${pad(Math.min(d,dim))}`;};
const fmtDate=s=>s?new Date(dnum(s)*864e5).toLocaleDateString('en-IN',{timeZone:'UTC',day:'numeric',month:'short',year:'numeric'}):'—';
const fmtMonth=s=>s?new Date(dnum(s+'-01')*864e5).toLocaleDateString('en-IN',{timeZone:'UTC',month:'long',year:'numeric'}):'—';
const fmtMY=s=>s?new Date(dnum(s)*864e5).toLocaleDateString('en-IN',{timeZone:'UTC',month:'short',year:'numeric'}):'—';
const fmtTime=ts=>new Date(ts).toLocaleString('en-IN',{timeZone:TZ,day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const inr=(n,d=null)=>(n==null||!isFinite(n))?'—':new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',
  minimumFractionDigits:d??(Number.isInteger(n)?0:2),maximumFractionDigits:d??2}).format(n);
const plural=(n,a,b)=>n===1?a:(b||a+'s');
const num=v=>{if(v===''||v==null)return null;const n=Number(String(v).replace(/,/g,'').trim());return Number.isFinite(n)?n:NaN;};
const CATS=['Face','Eyes','Lips','Cheeks','Skincare','Tools','Other'];
const CAT_EMOJI={Face:'🌸',Eyes:'👀',Lips:'💋',Cheeks:'🍑',Skincare:'🧴',Tools:'🖌️',Other:'✨'};
const catEmoji=c=>CAT_EMOJI[c]||'💖';
const FINISHES=['Matte','Dewy','Shimmer','Satin','Glossy','Natural','Glitter','Cream','Powder'];
const VERDICT={yes:['💖','Yes, repurchase'],maybe:['🤔','Maybe'],no:['👋','No thanks']};
const PCT_STOPS=[[1,'Full'],[.75,'¾'],[.5,'½'],[.25,'¼'],[.1,'Almost done']];

/* ---------- 2. STORAGE (IndexedDB, localStorage fallback, all in try/catch) ---------- */
const DB_NAME='project-pan',STORE='kv';
let db=null, storageWarned=false;
function idbOpen(){return new Promise((res,rej)=>{try{const r=indexedDB.open(DB_NAME,1);
  r.onupgradeneeded=()=>{try{r.result.createObjectStore(STORE)}catch(e){}};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));}catch(e){rej(e)}});}
const idbGet=k=>new Promise((res,rej)=>{try{const q=db.transaction(STORE).objectStore(STORE).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}});
const idbPut=(k,v)=>new Promise((res,rej)=>{try{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('aborted'))}catch(e){rej(e)}});
async function loadRaw(){
  try{db=await idbOpen();const v=await idbGet('state');if(v)return v;}catch(e){db=null;}
  try{const s=localStorage.getItem('pp_state');if(s)return JSON.parse(s);}catch(e){}

const P=id=>S.products.find(p=>p.id===id);
const logsOf=id=>S.logs.filter(l=>l.pid===id);
const allCats=()=>[...new Set([...CATS,...S.settings.cats,...S.products.map(p=>p.category)])];
function pstats(p){
  const L=logsOf(p.id),logged=L.length,est=p.preUsed?p.estPast:0,total=est+logged,E=Math.max(1,p.expected);
  const rawRem=p.preUsed?Math.round(E*p.pctLeft)-(logged-p.calibLogged):E-logged;
  const remaining=Math.max(0,rawRem);
  const cpu=(p.price!=null&&total>0)?p.price/total:null;
  // pace uses ONLY app logs in the last 30 days
  const today=istDay(),from=addDays(today,-29),recent=L.filter(l=>l.day>=from);
  let pace=null,finishEst=null;
  if(recent.length>=3){
    const first=L.reduce((m,l)=>l.day<m?l.day:m,today);
    const start=first>from?first:from,span=Math.max(1,diffDays(start,today)+1);
    pace=recent.length/span;
    if(remaining>0&&pace>0)finishEst=addDays(today,Math.ceil(remaining/pace));
  }
  let exp=null,expDays=null;
  if(p.dateOpened&&p.pao){exp=addMonths(p.dateOpened,p.pao);expDays=diffDays(today,exp);}
  return{logged,est,total,E,remaining,bonus:rawRem<0,progress:Math.min(1,Math.max(0,(E-remaining)/E)),cpu,approx:est>0&&cpu!=null,
    pace,finishEst,enough:recent.length>=3,exp,expDays,L};
}
function expBadge(st){if(st.expDays==null)return'';
  if(st.expDays<0)return`<span class="chip bad">⏰ Expired</span>`;
  if(st.expDays<=30)return`<span class="chip warn">⏳ Expires in ${st.expDays} ${plural(st.expDays,'day')}</span>`;return'';}
function avgUses(cat){const f=S.products.filter(p=>p.status==='finished'&&!p.preUsed&&p.category===cat&&logsOf(p.id).length>0);
  return f.length?Math.round(f.reduce((a,p)=>a+logsOf(p.id).length,0)/f.length):null;}
function daysLasted(p){return p.startDate&&p.finishDate?Math.max(1,diffDays(p.startDate,p.finishDate)):null;}
function streaks(){
  const set=new Set(S.logs.map(l=>l.day)),days=[...set].sort();let best=0,run=0,prev=null;
  for(const d of days){run=(prev&&diffDays(prev,d)===1)?run+1:1;best=Math.max(best,run);prev=d;}
  const today=istDay();let cur=0,d=set.has(today)?today:addDays(today,-1);while(set.has(d)){cur++;d=addDays(d,-1);}
  return{cur,best,set};
}
function noBuyInfo(){
  const today=istDay();
  const ev=[...S.products.filter(p=>p.dateBought&&!p.gift&&p.dateBought<=today).map(p=>p.dateBought),...S.noBuy.resets.filter(d=>d<=today)];
  if(!ev.length)ev.push(S.noBuy.since);
  const u=[...new Set(ev)].sort();let longest=0;
  for(let i=1;i<u.length;i++)longest=Math.max(longest,diffDays(u[i-1],u[i]));
  const cur=Math.max(0,diffDays(u[u.length-1],today));
  return{cur,longest:Math.max(longest,cur),last:u[u.length-1]};
}

function loadImage(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('img'));i.src=src;});}
async function compress(blobOrFile,max=640,keepAlpha=false){
  const url=URL.createObjectURL(blobOrFile);
  try{
    const im=await loadImage(url),sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)||1);
    const w=Math.max(1,Math.round(im.naturalWidth*sc)),h=Math.max(1,Math.round(im.naturalHeight*sc));
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;const c=cv.getContext('2d');
    if(!keepAlpha){c.fillStyle='#fff';c.fillRect(0,0,w,h);}
    c.drawImage(im,0,0,w,h);
    let out=cv.toDataURL('image/webp',.8);
    if(!out.startsWith('data:image/webp'))out=keepAlpha?cv.toDataURL('image/png'):cv.toDataURL('image/jpeg',.82);
    if(out.length>3.5e6)throw new Error('big');
    return out;
  }finally{URL.revokeObjectURL(url);}
}
async function removeBg(dataUrl){
  // client-side background removal; any failure falls back to the original photo
  const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))]);
  const mod=await withTimeout(import('https://esm.sh/@imgly/background-removal@1.5.5'),45000);
  const fn=mod.removeBackground||mod.default;if(typeof fn!=='function')throw new Error('nolib');
  const blob=await (await fetch(dataUrl)).blob();
  const out=await withTimeout(fn(blob),120000);
  return compress(out,560,true);
}

function ring(st,size=132){
  const r=54,C=2*Math.PI*r;
  return`<div class="ringwrap" style="width:${size}px;height:${size}px"><svg viewBox="0 0 132 132" width="${size}" height="${size}" role="img" aria-label="${Math.round(st.progress*100)} percent used">
    <defs><linearGradient id="rg" x1="0" x2="1"><stop offset="0" stop-color="#ff8fc7"/><stop offset="1" stop-color="#7b5be0"/></linearGradient></defs>
    <circle cx="66" cy="66" r="${r}" fill="none" stroke="rgba(160,110,200,.25)" stroke-width="13"/>
    <circle cx="66" cy="66" r="${r}" fill="none" stroke="url(#rg)" stroke-width="13" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-st.progress)}" style="transition:stroke-dashoffset .6s"/></svg>
    <div class="mid"><div><span style="font-size:1.5rem">${Math.round(st.progress*100)}%</span><br><span class="small muted">${st.E-st.remaining}/${st.E} uses</span></div></div></div>`;
}
function spark(p,st){
  if(!(p.price>0)||st.logged<2)return'';
  const pts=[];for(let i=1;i<=st.logged;i++)pts.push(p.price/(st.est+i));
  const step=Math.max(1,Math.ceil(pts.length/30)),s=pts.filter((_,i)=>i%step===0||i===pts.length-1),mx=Math.max(...s),mn=Math.min(...s),rg=mx-mn||1;
  const xy=s.map((v,i)=>`${(i/(s.length-1||1))*290+5},${52-((v-mn)/rg)*44}`).join(' ');
  return`<svg viewBox="0 0 300 60" width="100%" height="60" role="img" aria-label="Cost per use is dropping"><polyline points="${xy}" fill="none" stroke="#a24fcf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div class="row between small muted"><span>${st.approx?'~':''}${inr(mx,2)}</span><span>cost per use ↓</span><span>${st.approx?'~':''}${inr(mn,2)}</span></div>`;
}

function recapData(ym){
  const logs=S.logs.filter(l=>l.day.startsWith(ym)),fin=S.products.filter(p=>p.status==='finished'&&p.finishDate&&p.finishDate.startsWith(ym));
  const value=logs.reduce((a,l)=>{const p=P(l.pid);return a+(p&&p.price>0?p.price/Math.max(1,p.expected):0);},0);
  const cnt={};logs.forEach(l=>cnt[l.pid]=(cnt[l.pid]||0)+1);
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  const days=[...new Set(logs.map(l=>l.day))].sort();let best=0,run=0,prev=null;for(const d of days){run=(prev&&diffDays(prev,d)===1)?run+1:1;best=Math.max(best,run);prev=d;}
  return{ym,fin:fin.length,uses:logs.length,value,top:top?{name:(P(top[0])||{}).name||'—',n:top[1]}:null,best};
}

const taps={},lastLog={};let down=null;

  if(l&&t-l.t<420&&Math.hypot(e.clientX-l.x,e.clientY-l.y)<56){taps[id]=null;logUse(id,e.clientX,e.clientY);}
  else taps[id]={t,x:e.clientX,y:e.clientY};
},true);
document.addEventListener('dblclick',e=>{if(e.target.closest('.bcard'))e.preventDefault();});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('bcard')){e.preventDefault();const r=e.target.getBoundingClientRect();logUse(e.target.dataset.id,r.left+r.width/2,r.top+r.height/2);}
  if(e.key==='Escape')closeSheet();
});
function logUse(pid,x,y){
  const p=P(pid);if(!p||p.status!=='active')return;
  const now=Date.now();if(now<UI.lock||now-(lastLog[pid]||0)<300)return;lastLog[pid]=now;
  const d=new Date(),l={id:uid(),pid,ts:d.toISOString(),day:istDay(d),setStart:false};
  if(!p.startDate){p.startDate=l.day;l.setStart=true;}
  S.logs.push(l);undoStack.push(l.id);if(undoStack.length>50)undoStack.shift();
  const before=S.basket.map(P).filter(q=>q&&q.status==='active'),todayN=new Set(S.logs.filter(q=>q.day===l.day).map(q=>q.pid));
  save();checkBadges();render(true);
  const card=$(`.bcard[data-id="${pid}"]`);if(card){card.classList.add('pop');if(x==null){const r=card.getBoundingClientRect();x=r.left+r.width/2;y=r.top+r.height/2;}}
  burst(x??innerWidth/2,y??innerHeight/2);haptic();
  toast('Logged ✨',{label:'Undo',fn:undoLast});
  if(before.length&&before.every(q=>todayN.has(q.id))&&UI.tab==='today'&&!UI.detail)confetti(70);
}
function undoLast(){
  const id=undoStack.pop();if(!id)return;const i=S.logs.findIndex(l=>l.id===id);if(i<0)return undoLast();
  const [l]=S.logs.splice(i,1),p=P(l.pid);if(p&&l.setStart&&!S.logs.some(x=>x.pid===p.id))p.startDate=null;
  save();render(true);toast('Undone ↩︎');
}
function removeLog(id){
  const i=S.logs.findIndex(l=>l.id===id);if(i<0)return;const [l]=S.logs.splice(i,1),p=P(l.pid),oldStart=p&&p.startDate;
  if(p&&l.setStart&&!S.logs.some(x=>x.pid===p.id))p.startDate=null;
  const k=undoStack.indexOf(id);if(k>=0)undoStack.splice(k,1);
  save();render(true);toast('Log removed',{label:'Undo',fn:()=>{S.logs.push(l);if(p)p.startDate=oldStart;save();render(true);}});
}

function setErr(id,msg){const e=$('#e-'+id),i=$('#'+id);if(e)e.textContent=msg||'';if(i)i.classList.toggle('bad',!!msg);if(i)i.setAttribute('aria-invalid',!!msg);}
function submitProduct(){
  const v=id=>($('#'+id)?.value??''),today=istDay(),E={};
  const fe=(id,m)=>{if(!E[id])E[id]=m;};
  const name=v('f-name').trim();if(!name)fe('f-name','Please give your product a name 💕');
  let cat=v('f-cat');if(cat==='__new'){cat=v('f-catnew').trim();if(!cat)fe('f-catnew','Type a name for your new category');else if(cat.length>24)fe('f-catnew','Keep it under 24 characters');}
  const price=num(v('f-price'));if(Number.isNaN(price))fe('f-price','Price should be a number, like 499');else if(price!=null&&price<0)fe('f-price',"Price can't be negative");else if(price!=null&&price>1e7)fe('f-price','That looks too high — please check');
  let exp=num(v('f-exp'));const used=F.preUsed;
  if(Number.isNaN(exp)||(exp!=null&&(!Number.isInteger(exp)||exp<1||exp>10000)))fe('f-exp','Use a whole number between 1 and 10,000');
  else if(exp==null&&!used)fe('f-exp','Please guess how many uses it will last — you can change it later');
  const bought=v('f-bought')||null;if(bought&&bought>today)fe('f-bought',"Purchase date can't be in the future");
  const pao=num(v('f-pao'));if(Number.isNaN(pao)||(pao!=null&&(!Number.isInteger(pao)||pao<1||pao>120)))fe('f-pao','PAO is a number of months, like 12');
  let opened=used?(v('f-openedm')?v('f-openedm')+'-01':null):(v('f-opened')||null);
  if(opened&&opened>(used?today.slice(0,7)+'-31':today))fe(used?'f-openedm':'f-opened',"Date opened can't be in the future");
  let past=null;if(used&&!$('#f-pastunk').checked&&v('f-past').trim()!==''){past=num(v('f-past'));if(Number.isNaN(past)||!Number.isInteger(past)||past<0||past>100000)fe('f-past','Use a whole number, or tick “I don\'t know”');}
  const start=$('#f-start')?(v('f-start')||null):null;if(start&&start>today)fe('f-start',"Start date can't be in the future");
  ['f-name','f-catnew','f-price','f-exp','f-bought','f-pao','f-opened','f-openedm','f-past','f-start'].forEach(i=>setErr(i,E[i]));
  const bad=Object.keys(E)[0];if(bad){const el=$('#'+bad);el&&el.focus();el&&el.scrollIntoView({block:'center',behavior:'smooth'});return;}
  const brand=v('f-brand').trim(),shade=v('f-shade').trim();
  if(!F.dup&&S.products.some(q=>q.id!==F.id&&q.name.toLowerCase()===name.toLowerCase()&&q.brand.toLowerCase()===brand.toLowerCase()&&q.shade.toLowerCase()===shade.toLowerCase())){
    F.dup=true;$('#dupNote').hidden=false;$('#saveBtn').textContent='Save anyway';$('#dupNote').scrollIntoView({block:'center'});return;}
  const old=F.id?P(F.id):null,E0=exp??(old?old.expected:(avgUses(cat)||60));
  const base=old||{id:uid(),status:'active',finishDate:null,verdict:null,note:'',startDate:null,pctLeft:1,estPast:0,calibLogged:0,created:today,demo:false};
  Object.assign(base,{name,brand,category:cat,price,shade,finish:v('f-finish').trim(),expected:E0,photo:PH.photo,store:v('f-store').trim(),dateBought:bought,
    gift:$('#f-gift').checked,dateOpened:opened,pao});
  if(!old){
    base.preUsed=used;
    if(used){const ns=$('#f-notsure').checked;let pct=ns?null:PCT_STOPS[+$('#f-pct').value][0];
      if(pct==null)pct=past!=null?Math.min(1,Math.max(0,(E0-past)/E0)):.5;
      base.pctLeft=pct;base.estPast=past??Math.round(E0*(1-pct));base.calibLogged=0;base.startDate=today;}

  if(cat&&!CATS.includes(cat)&&!S.settings.cats.includes(cat))S.settings.cats.push(cat);
  save();closeSheet();toast(old?'Saved ✨':'Added to your collection 💖');
  if(!old&&!F.fromWish&&location.hash!=='#collection'&&!UI.detail){/* stay */}
  render(true);

// ---- finish / restore / verdict / recalibrate ----
function finishProduct(id){
  const p=P(id);if(!p||p.status!=='active')return;
  p.status='finished';p.finishDate=istDay();S.basket=S.basket.filter(x=>x!==id);
  const done=[];S.challenges.forEach(c=>{if(!c.done&&chalProgress(c)>=c.target){c.done=istDay();done.push(c);}});
  checkBadges(false);save();confetti(180);haptic([20,40,20]);render(true);verdictSheet(id,true);
  if(done.length)setTimeout(()=>toast(`Challenge complete 🎉 ${done[0].title}`,{ms:4000}),900);
}
function verdictSheet(id,first){
  const p=P(id);if(!p)return;let v=p.verdict;
  openSheet(`<h2>${first?'Hooray, you finished it! 🎉':'Repurchase verdict'}</h2><p class="muted long">${esc(p.name)}</p><h3>Would I repurchase?</h3>

function recalSheet(id){
  const p=P(id);if(!p)return;const idx=PCT_STOPS.reduce((b,s,i)=>Math.abs(s[0]-p.pctLeft)<Math.abs(PCT_STOPS[b][0]-p.pctLeft)?i:b,0);

function moveBasket(id,dir){

  const b=$(`.brow[data-id="${id}"] [data-act="${dir<0?'bk-up':'bk-down'}"]`);b&&b.focus();

// drag to reorder (pointer-based, works on touch + mouse)
let drag=null;
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest&&e.target.closest('[data-handle]');if(!h)return;e.preventDefault();
  const row=h.closest('.brow');drag={row,list:row.parentNode};row.classList.add('dragging');try{h.setPointerCapture(e.pointerId)}catch(x){}
});
document.addEventListener('pointermove',e=>{
  if(!drag)return;const el=document.elementFromPoint(e.clientX,e.clientY),t=el&&el.closest&&el.closest('.brow');
  if(t&&t!==drag.row&&t.parentNode===drag.list){const r=t.getBoundingClientRect();drag.list.insertBefore(drag.row,e.clientY<r.top+r.height/2?t:t.nextSibling);}
});
const endDrag=()=>{if(!drag)return;drag.row.classList.remove('dragging');const order=$$('.brow',drag.list).map(r=>r.dataset.id);
  S.basket=[...order,...S.basket.filter(x=>!order.includes(x))];drag=null;save();render(true);};
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);

// ---- recap image ----
function saveRecap(ym){
  const r=recapData(ym),cv=document.createElement('canvas');cv.width=1080;cv.height=1350;const c=cv.getContext('2d');
  const g=c.createLinearGradient(0,0,1080,1350);g.addColorStop(0,'#ffd1ea');g.addColorStop(.6,'#e4d2ff');g.addColorStop(1,'#d6dcff');c.fillStyle=g;c.fillRect(0,0,1080,1350);
  c.fillStyle='rgba(255,255,255,.55)';c.beginPath();c.roundRect?c.roundRect(60,60,960,1230,60):c.rect(60,60,960,1230);c.fill();
  const F='Nunito, ui-rounded, system-ui, sans-serif';c.fillStyle='#43264f';c.textAlign='center';
  c.font=`800 44px ${F}`;c.fillText('✨ Project Pan recap ✨',540,170);c.font=`900 84px ${F}`;c.fillText(fmtMonth(ym),540,290);
  const fit=(t,w)=>{while(c.measureText(t).width>w&&t.length>3)t=t.slice(0,-2);return t;};
  const rows=[['Products finished',String(r.fin)],['Uses logged',String(r.uses)],["Money's worth used",inr(r.value,0)],['Most-used product',r.top?r.top.name+' ('+r.top.n+')':'—'],['Best streak',r.best+' '+plural(r.best,'day')]];
  rows.forEach((x,i)=>{const y=470+i*160;c.textAlign='left';c.font=`700 40px ${F}`;c.fillStyle='#7d6390';c.fillText(x[0],130,y);
    c.textAlign='right';c.font=`900 56px ${F}`;c.fillStyle='#43264f';c.fillText(fit(x[1],520),950,y+4);
    c.strokeStyle='rgba(90,50,130,.25)';c.setLineDash([10,10]);c.lineWidth=3;c.beginPath();c.moveTo(130,y+50);c.lineTo(950,y+50);c.stroke();});
  c.setLineDash([]);c.textAlign='center';c.font=`800 40px ${F}`;c.fillStyle='#7b5be0';c.fillText('💖 keep panning! 💖',540,1230);
  cv.toBlob(async b=>{if(!b)return toast("Couldn't make the image",{warn:true});
    try{const f=new File([b],`project-pan-${ym}.png`,{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'My Project Pan recap'});return;}}catch(e){if(e&&e.name==='AbortError')return;}
    if(download(`project-pan-${ym}.png`,b))toast('Recap saved as image 📸');},'image/png');
}

/* ---------- 9. BACKUP ---------- */
function csv(rows){const q=v=>{let s=v==null?'':String(v);if(/^[=+\-@]/.test(s)&&isNaN(Number(s)))s="'"+s;return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};return'﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n');}
function exportData(kind){
  try{const t=istDay();
    if(kind==='json'){download(`project-pan-backup-${t}.json`,new Blob([JSON.stringify(S)],{type:'application/json'}));toast('Backup saved 💾');}
    else if(kind==='prod'){const r=[['Name','Brand','Category','Shade','Finish','Price (INR)','Expected uses','Uses logged','Est. past uses','Cost per use','Status','Gift','Store','Date bought','Date opened','PAO (months)','Tracking start','Finish date','Repurchase','Note','Partly tracked']];
      S.products.forEach(p=>{const s=pstats(p);r.push([p.name,p.brand,p.category,p.shade,p.finish,p.price,p.expected,s.logged,s.est,s.cpu==null?'':s.cpu.toFixed(2),p.status,p.gift?'yes':'no',p.store,p.dateBought,p.dateOpened,p.pao,p.startDate,p.finishDate,p.verdict,p.note,p.preUsed?'yes':'no']);});
      download(`project-pan-products-${t}.csv`,new Blob([csv(r)],{type:'text/csv'}));}
    else{const r=[['Product','Date (IST)','Time (IST)','Timestamp']];S.logs.slice().sort((a,b)=>a.ts.localeCompare(b.ts)).forEach(l=>{const p=P(l.pid);r.push([p?p.name:'',l.day,new Date(l.ts).toLocaleTimeString('en-IN',{timeZone:TZ}),l.ts]);});
      download(`project-pan-logs-${t}.csv`,new Blob([csv(r)],{type:'text/csv'}));}
  }catch(e){toast("Couldn't export — please try again.",{warn:true});}
}
async function importFile(file){
  try{
    if(!file)return;if(file.size>80e6)throw new Error('big');
    let obj;try{obj=JSON.parse(await file.text());}catch(e){throw new Error('notjson');}
    if(!obj||typeof obj!=='object'||obj.app!=='project-pan'||!Array.isArray(obj.products)||!Array.isArray(obj.logs))throw new Error('shape');
    const n=normalize(obj);
    if(n.products.length===0&&obj.products.length>0)throw new Error('empty');
    const ok=await ask({title:'Replace everything? ⚠️',msg:`This backup has ${n.products.length} products and ${n.logs.length} logged uses. Importing will REPLACE all the data on this device.`,ok:'Replace my data',danger:true});
    if(!ok)return;S=n;checkBadges(true);await persist();applyTheme();render(false);toast('Backup imported 💖');
  }catch(e){toast(e.message==='big'?'That file is too large to be a backup.':"That doesn't look like a Project Pan backup, so nothing was changed.",{warn:true,ms:6000});}
  finally{$('#fileImport').value='';}
}

/* demo data */
function seedDemo(){
  const t=istDay(),mk=(o)=>Object.assign({id:'demo-'+uid(),brand:'',shade:'',finish:'',price:null,photo:null,store:'',dateBought:null,gift:false,dateOpened:null,pao:null,startDate:null,status:'active',finishDate:null,verdict:null,note:'',preUsed:false,pctLeft:1,estPast:0,calibLogged:0,created:t,demo:true},o);
  const P1=mk({name:'Soft Pinch Blush',brand:'Petal Co.',category:'Cheeks',price:1800,shade:'Joy',finish:'Dewy',expected:60,store:'Nykaa',dateBought:addDays(t,-45),dateOpened:addDays(t,-40),pao:12});
  const P2=mk({name:'Velvet Lip Tint',brand:'Berry Lane',category:'Lips',price:650,shade:'Rosewood',finish:'Matte',expected:80,store:'Tira',dateBought:addDays(t,-380),dateOpened:addDays(t,-350),pao:12});
  const P3=mk({name:'Glow Serum',category:'Skincare',price:1299,finish:'Dewy',expected:90,dateBought:addDays(t,-60),dateOpened:addDays(t,-55),pao:6});
  const P4=mk({name:'Fluffy Blending Brush',category:'Tools',price:499,gift:true,expected:200,dateBought:addDays(t,-100)});
  const P5=mk({name:'Lavender Dreams Palette',brand:'Moonlit',category:'Eyes',price:2200,finish:'Shimmer',expected:120,preUsed:true,pctLeft:.5,estPast:60,startDate:addDays(t,-20),dateOpened:addDays(t,-200).slice(0,7)+'-01',pao:24});
  const P6=mk({name:'Rosy Lip Balm',category:'Lips',price:350,expected:40,status:'finished',startDate:addDays(t,-70),finishDate:addDays(t,-31),verdict:'yes',note:'Holy grail!',dateBought:addDays(t,-80)});
  const P7=mk({name:'Mini Mascara',category:'Eyes',price:450,expected:50,preUsed:true,pctLeft:.1,estPast:30,status:'finished',startDate:addDays(t,-25),finishDate:addDays(t,-5),verdict:'maybe'});
  const prods=[P1,P2,P3,P4,P5,P6,P7];S.products.push(...prods);S.basket.push(P1.id,P2.id,P3.id,P4.id);
  const mkLog=(p,day,h,setStart)=>S.logs.push({id:'demo-'+uid(),pid:p.id,ts:new Date(dnum(day)*864e5-19800000+h*36e5).toISOString(),day,setStart:!!setStart,demo:true});
  let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  const gen=(p,from,to,prob,n)=>{let c=0;for(let d=from;d<=to&&c<n;d++)if(rnd()<prob){mkLog(p,addDays(t,d),8+(rnd()*12|0));c++;}};
  gen(P1,-17,-1,.9,18);gen(P2,-30,-1,.95,30);gen(P3,-40,-1,.95,40);gen(P4,-25,-1,.9,22);gen(P5,-19,-1,.7,12);gen(P6,-70,-32,.97,40);gen(P7,-25,-6,.95,20);
  mkLog(P1,t,9);
  S.wishlist.push({id:'demo-'+uid(),name:'Peachy Highlighter',price:1500,link:'',photo:null,added:addDays(t,-10),demo:true});
  S.challenges.push({id:'demo-'+uid(),title:'Use up 3 products in 3 months',target:3,start:addDays(t,-45),end:addDays(t,45),done:null,demo:true});
  S.seeded=true;checkBadges(true);
}
function clearDemo(){
  const ids=new Set(S.products.filter(p=>p.demo).map(p=>p.id));
  S.products=S.products.filter(p=>!p.demo);S.logs=S.logs.filter(l=>!l.demo&&!ids.has(l.pid));S.basket=S.basket.filter(i=>!ids.has(i));
  S.wishlist=S.wishlist.filter(w=>!w.demo);S.challenges=S.challenges.filter(c=>!c.demo);S.badges={};checkBadges(true);
}

/* ---------- click router + form events ---------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const a=el.dataset.act,id=el.dataset.id,v=el.dataset.v;
  switch(a){
    case 'theme':{const dark=document.documentElement.dataset.theme==='dark';S.settings.dark=!dark;applyTheme();save();break;}
    case 'close':closeSheet();break;
    case 'ask-yes':{const f=ask.fin;closeSheet.onClose=null;closeSheet();f&&f(true);break;}
    case 'ask-no':closeSheet();break;
    case 'toast-act':{const f=toast.fn;$('#toasts').innerHTML='';toast.fn=null;f&&f();break;}
    case 'newp':closeSheetNow();productForm(null);break;
    case 'editp':productForm(id);break;
    case 'delp':{const p=P(id);if(!p)break;const ok=await ask({title:'Delete this product?',msg:`“${p.name}” and all its logged uses will be removed. This can't be undone.`,ok:'Delete',danger:true});
      if(ok){S.products=S.products.filter(x=>x.id!==id);S.logs=S.logs.filter(l=>l.pid!==id);S.basket=S.basket.filter(x=>x!==id);save();checkBadges(true);if(UI.detail===id)location.hash='#'+UI.tab;else render(true);toast('Deleted');}break;}
    case 'mode':{F.preUsed=v==='used';$$('[data-act=mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));$('#usedBox').hidden=!F.preUsed;$('#newBox').hidden=F.preUsed;
      $('#priceOpt').textContent=F.preUsed?' (optional)':'';break;}
    case 'useavg':$('#f-exp').value=v;break;
    case 'photo-pick':$('#filePhoto').click();break;
    case 'photo-rm':PH.photo=PH.orig=null;PH.bg=false;PH.msg='';updPhoto();break;
    case 'photo-orig':PH.photo=PH.orig;PH.bg=false;PH.msg='';updPhoto();break;
    case 'photo-bg':{if(PH.busy||!PH.photo)break;PH.busy=true;PH.msg='Removing background… the first time can take a little while ✨';updPhoto();
      try{const out=await removeBg(PH.photo);PH.photo=out;PH.bg=true;PH.msg='Background removed ✨';}
      catch(err){PH.msg="Couldn't remove the background (you may be offline) — using your original photo.";}
      PH.busy=false;updPhoto();break;}
    case 'log':logUse(id,null,null);break;
    case 'finish':finishProduct(id);break;
    case 'restore':{const p=P(id);if(p){p.status='active';p.finishDate=null;p.verdict=null;p.note='';save();checkBadges(true);render(true);toast('Restored to your collection ↩︎');}break;}
    case 'verdict':verdictSheet(id,false);break;
    case 'vpick':verdictSheet.v=v;$$('#vseg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));break;
    case 'vsave':{const p=P(id);if(p){p.verdict=verdictSheet.v||null;p.note=($('#vnote').value||'').trim().slice(0,120);save();closeSheet();render(true);toast('Saved 💖');}break;}
    case 'recal':recalSheet(id);break;
    case 'recal-save':{const p=P(id);if(!p)break;const pct=PCT_STOPS[+$('#f-pct').value][0],lg=logsOf(id).length;
      p.pctLeft=pct;p.calibLogged=lg;p.estPast=Math.max(0,Math.round(p.expected*(1-pct))-lg);save();closeSheet();render(true);toast('Recalibrated 🎚️');break;}
    case 'raise':{const p=P(id);if(p)numSheet({title:'Raise expected uses',msg:"You've gone past your estimate — nice! How many total uses do you expect now?",label:'Expected total uses',val:p.expected+Math.max(10,Math.round(p.expected*.25)),ok:'Save',id,act:'raise-save'});break;}
    case 'raise-save':{const n=num($('#nval').value),p=P(id);if(n==null||Number.isNaN(n)||!Number.isInteger(n)||n<1||n>10000){setErr('nval','Use a whole number from 1 to 10,000');break;}
      if(p){p.expected=n;save();closeSheet();render(true);}break;}
    case 'bk-toggle':{if(S.basket.includes(id))S.basket=S.basket.filter(x=>x!==id);else S.basket.push(id);save();render(true);toast(S.basket.includes(id)?'Added to basket 🧺':'Removed from basket');break;}
    case 'pick':pickSheet();break;
    case 'pick-save':{const ids=$$('.pk:checked').map(c=>c.value);S.basket.push(...ids.filter(i=>!S.basket.includes(i)));save();closeSheet();render(true);break;}
    case 'edit-basket':UI.edit=!UI.edit;render(true);break;
    case 'bk-up':moveBasket(id,-1);break;case 'bk-down':moveBasket(id,1);break;
    case 'bk-rm':S.basket=S.basket.filter(x=>x!==id);save();render(true);break;
    case 'rmlog':removeLog(id);break;
    case 'cat':UI.cat=v;render(true);break;
    case 'chal-new':chalSheet();break;
    case 'chal-del':{const ok=await ask({title:'Delete challenge?',msg:'Your products and logs stay safe.',ok:'Delete',danger:true});if(ok){S.challenges=S.challenges.filter(c=>c.id!==id);save();render(true);}break;}
    case 'nobuy-reset':{const ok=await ask({title:'Reset no-buy counter?',msg:'Only do this if you bought something (it\'s okay, it happens 💕). Your longest streak is kept.',ok:'Reset'});if(ok){S.noBuy.resets.push(istDay());save();render(true);}break;}
    case 'wish-new':wishSheet();break;
    case 'wish-del':{const ok=await ask({title:'Remove from wishlist?',msg:'You can always add it again later.',ok:'Remove'});if(ok){S.wishlist=S.wishlist.filter(w=>w.id!==id);save();render(true);}break;}
    case 'wish-buy':{const w=S.wishlist.find(x=>x.id===id);if(!w||diffDays(istDay(),addDays(w.added,30))>0)break;
      const ok=await ask({title:'Turn it into a product? 💄',msg:`Add “${w.name}” to your collection now? Choose “Not now” to just tick it off.`,ok:'Yes, add it',cancel:'Not now'});
      if(ok){closeSheetNow();setTimeout(()=>{productForm(null,{name:w.name,price:w.price,photo:w.photo,dateBought:istDay(),fromWish:w.id});},230);}
      else{S.wishlist=S.wishlist.filter(x=>x.id!==id);S.noBuy.resets.push(istDay());save();render(true);toast('Enjoy! 🛍️');}break;}
    case 'recap-save':saveRecap(v);break;
    case 'export-json':exportData('json');break;case 'export-prod':exportData('prod');break;case 'export-logs':exportData('logs');break;
    case 'import':$('#fileImport').click();break;
    case 'demo-load':seedDemo();save();render(true);toast('Demo data loaded — clear it anytime 🎈');break;
    case 'demo-clear':{const ok=await ask({title:'Clear demo data?',msg:'Only the demo items are removed. Anything you added stays.',ok:'Clear demo'});if(ok){clearDemo();save();render(true);toast('Demo data cleared');}break;}
  }
});
document.addEventListener('submit',e=>{e.preventDefault();const id=e.target.id;
  if(id==='pform')submitProduct();else if(id==='cform')submitChal();else if(id==='wform')submitWish();});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='f-pct'){const i=+t.value;$('#stops').innerHTML=stopsHtml(i);t.setAttribute('aria-valuetext',PCT_STOPS[i][1]);}
  if(t.id==='q'){UI.q=t.value;$('#plist').innerHTML=collectionList();}
  if(t.id==='f-pastunk'){$('#f-past').disabled=t.checked;}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='f-cat'){$('#catnew').hidden=t.value!=='__new';updHint();}
  if(t.id==='f-pastunk'){$('#f-past').disabled=t.checked;}
  if(t.id==='eCat'){UI.eCat=t.value;$('#elist').innerHTML=emptiesList();}
  if(t.id==='eVer'){UI.eVer=t.value;$('#elist').innerHTML=emptiesList();}
  if(t.id==='fileImport')importFile(t.files&&t.files[0]);
  if(t.id==='filePhoto'){const f=t.files&&t.files[0];t.value='';if(!f)return;
    if(!/^image\//.test(f.type)){PH.msg='Please choose an image file.';updPhoto();return;}
    compress(f,640,false).then(d=>{PH.photo=PH.orig=d;PH.bg=false;PH.msg='';updPhoto();}).catch(()=>{PH.msg="Couldn't read that photo — try another one.";updPhoto();});}
});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet();});

/* ---------- 10. INIT ---------- */
(async function init(){
  let raw=null;try{raw=await loadRaw();}catch(e){}
  S=normalize(raw);applyTheme();
  if(checkBadges(true))save();
  if(!location.hash)history.replaceState(null,'','#today');
  render(false);scheduleMidnight();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
  try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
  window.__ready=true;
})();
