<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Project Pan</title>
<meta name="theme-color" content="#FFF1EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Project Pan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ THEME ============ */
:root{--bg:#FFF1EE;--card:#fff;--card2:#F3F1FC;--chip:#E4DEF7;--ink:#1E2B4D;--ink2:#6B5B95;--muted:#8B87A8;--pink:#F08CA3;--pink2:#FFB3BF;--pinksoft:#FFDCE2;--line:rgba(30,43,77,.09);--shadow:0 8px 26px rgba(107,91,149,.14);--shadow2:0 3px 10px rgba(107,91,149,.12);--glass:rgba(255,255,255,.74);--btn:#1E2B4D;--onbtn:#fff;--ok:#2FB784;--warn:#F2A33A;--bad:#E5484D;--okbg:#DDF5EA;--warnbg:#FFEBCF;--badbg:#FFDADB;color-scheme:light}
:root.dark{--bg:#2A1F3D;--card:#382B52;--card2:#44355F;--chip:#57467F;--ink:#F6F1FF;--ink2:#CDBBF5;--muted:#A798CC;--pinksoft:#5B3A5F;--line:rgba(255,255,255,.1);--shadow:0 8px 26px rgba(0,0,0,.35);--shadow2:0 3px 10px rgba(0,0,0,.3);--glass:rgba(56,43,82,.78);--btn:#E4DEF7;--onbtn:#2A1F3D;--okbg:#1F4D44;--warnbg:#5B4527;--badbg:#6A2F3A;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:500;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.4;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px;border-radius:12px}
.wrap{max-width:720px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(130px + env(safe-area-inset-bottom))}
h1{font-size:28px;line-height:1.1;font-weight:800;margin:0;letter-spacing:-.5px}
h2{font-size:20px;font-weight:800;margin:0}
h3{font-size:16px;font-weight:700;margin:0}
.lbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.muted{color:var(--muted)}.sm{font-size:13px}.xs{font-size:12px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.wrapf{flex-wrap:wrap}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.f{fill:currentColor}
/* buttons */
.rbtn{width:44px;height:44px;border-radius:50%;background:var(--card);box-shadow:var(--shadow2);display:grid;place-items:center;color:var(--ink);transition:transform .15s}
.rbtn:active{transform:scale(.92)}.rbtn.on{background:var(--pink);color:#fff}
.btn{min-height:48px;padding:0 22px;border-radius:999px;background:var(--btn);color:var(--onbtn);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,opacity .2s;text-align:center}
.btn:active{transform:scale(.97)}.btn.pink{background:var(--pink);color:#fff}.btn.soft{background:var(--chip);color:var(--ink)}.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}.btn.danger{background:var(--badbg);color:var(--bad)}.btn.sm{min-height:44px;padding:0 16px;font-size:14px}.btn.block{width:100%}.btn[disabled]{opacity:.5;pointer-events:none}
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:16px}
.card.lav{background:var(--card2);box-shadow:none}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;background:var(--card2);color:var(--ink2);font-size:12px;font-weight:700}
.pill.pk{background:var(--pinksoft);color:#C2415F}.dark .pill.pk{color:#FFB3BF}.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:#B26A00}.dark .pill.warn{color:#FFC76B}.pill.bad{background:var(--badbg);color:var(--bad)}
.chips{display:flex;gap:10px;overflow-x:auto;padding:6px 18px 10px;margin:0 -18px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px;padding:2px;font-size:12px;font-weight:700;color:var(--ink2)}
.chip .cc{width:52px;height:52px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:24px;box-shadow:var(--shadow2);border:3px solid transparent;transition:.2s}
.chip.on{color:var(--ink)}.chip.on .cc{border-color:var(--pink);background:var(--pinksoft)}
.tchip{min-height:44px;padding:0 16px;border-radius:999px;background:var(--card);box-shadow:var(--shadow2);font-weight:700;font-size:14px;color:var(--ink2);white-space:nowrap;flex:none}
.tchip.on{background:var(--btn);color:var(--onbtn)}
.seg{display:flex;background:var(--card2);border-radius:999px;padding:4px;gap:2px}.seg button{flex:1;min-height:44px;border-radius:999px;font-weight:700;font-size:14px;color:var(--ink2)}.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow2)}
/* nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(94vw,460px);height:72px;border-radius:36px;background:var(--glass);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);box-shadow:0 10px 34px rgba(107,91,149,.25);border:1px solid rgba(255,255,255,.5);display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:center;z-index:40;padding:0 6px}
.dark .nav{border-color:rgba(255,255,255,.08)}
.nav button.t{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;font-weight:700;color:var(--muted);min-height:56px;justify-content:center}
.nav button.t .ip{width:46px;height:30px;border-radius:15px;display:grid;place-items:center;transition:.25s}
.nav button.t.on{color:var(--ink)}.nav button.t.on .ip{background:var(--pinksoft)}
.nav .plus{width:62px;height:62px;border-radius:50%;background:var(--btn);color:var(--onbtn);display:grid;place-items:center;margin:-22px auto 0;box-shadow:0 8px 20px rgba(30,43,77,.4);border:4px solid var(--bg);transition:transform .2s}
.nav .plus:active{transform:scale(.92) rotate(90deg)}.nav .plus .ic{width:28px;height:28px;stroke-width:2.6}
/* grid */
.grid{display:grid;gap:10px;grid-template-columns:repeat(var(--cols),1fr)}
.tile{position:relative;aspect-ratio:1;border-radius:20px;background:var(--card2);overflow:hidden;display:grid;place-items:center;transition:transform .15s;box-shadow:inset 0 0 0 1px var(--line);padding:0;width:100%}
.tile:active{transform:scale(.95)}
.tile img.ph{width:100%;height:100%;object-fit:cover}.tile img.ph.cut{object-fit:contain;padding:8%}
.tile .art{width:62%;height:62%}
.bdg{position:absolute;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow2)}
.bdg .ic{width:12px;height:12px}.cols5 .bdg{width:16px;height:16px}.cols5 .bdg .ic{width:10px;height:10px}
.bdg.h{left:5px;top:5px;color:var(--pink)}.bdg.p{right:5px;top:5px;color:var(--ink2)}.bdg.e{right:5px;bottom:5px;width:11px;height:11px;background:var(--warn)}.bdg.e.bad{background:var(--bad)}
.tile .chk{position:absolute;inset:0;background:rgba(240,140,163,.28);display:grid;place-items:center}
.tile .chk span{width:28px;height:28px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center}
.tname{font-size:11px;font-weight:600;margin-top:4px;text-align:center;color:var(--ink2)}
/* basket */
.basket{display:flex;gap:10px;overflow-x:auto;padding:6px 18px 12px;margin:0 -18px;scrollbar-width:none}.basket::-webkit-scrollbar{display:none}
.bcard{position:relative;flex:none;width:112px;background:var(--card);border-radius:22px;box-shadow:var(--shadow2);padding:8px;text-align:center;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer;transition:transform .12s}
.bcard:active{transform:scale(.96)}
.bcard .ph{aspect-ratio:1;border-radius:16px;background:var(--card2);display:grid;place-items:center;overflow:hidden}.bcard .ph img{width:100%;height:100%;object-fit:cover}.bcard .ph img.cut{object-fit:contain;padding:6%}.bcard .ph .art{width:60%;height:60%}
.bcard .nm{font-size:12px;font-weight:700;margin:6px 2px 2px;min-height:30px}
.bcard .ct{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--card2);color:var(--ink2)}
.bcard.done .ct{background:var(--okbg);color:var(--ok)}
.bcard .info{position:absolute;right:4px;top:4px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.85);color:var(--ink2);display:grid;place-items:center}
.dark .bcard .info{background:rgba(42,31,61,.8)}.bcard .info .ic{width:14px;height:14px}
.burst{position:absolute;left:50%;top:40%;pointer-events:none;z-index:5}
.burst i{position:absolute;font-style:normal;font-size:16px;animation:bst .8s ease-out forwards;opacity:0}
@keyframes bst{0%{transform:translate(0,0) scale(.3);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(var(--r));opacity:0}}
.pop{animation:pop .35s}@keyframes pop{40%{transform:scale(1.08)}}
/* pages & sheets */
.page{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;overscroll-behavior:contain}
.page.enter{animation:slideup .28s ease-out}@keyframes slideup{from{transform:translateY(24px);opacity:0}}
.page .inner{max-width:720px;margin:0 auto;padding:0 18px calc(40px + env(safe-area-inset-bottom))}
.page .inner.abp{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
.hdr{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 0 12px}
.hdr h2{flex:1;text-align:center}.hdr .sp{width:44px}
.sheetbg{position:fixed;inset:0;background:rgba(30,20,50,.45);z-index:80;animation:fade .2s}@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:90vh;overflow-y:auto;background:var(--bg);border-radius:30px 30px 0 0;padding:10px 20px calc(26px + env(safe-area-inset-bottom));z-index:81;animation:slideup .25s ease-out;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--chip);margin:4px auto 14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(108px + env(safe-area-inset-bottom));background:var(--btn);color:var(--onbtn);padding:8px 8px 8px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:95;display:flex;align-items:center;gap:10px;font-weight:700;max-width:92vw;animation:slideup .25s}
.toast button{min-height:40px;padding:0 14px;border-radius:99px;background:rgba(255,255,255,.18);font-weight:800;color:inherit}
/* forms */
.field{margin-top:14px}.field>label,.field>.lbl{display:block;margin-bottom:6px}
.inp{width:100%;min-height:48px;border-radius:16px;border:2px solid transparent;background:var(--card);padding:0 14px;box-shadow:var(--shadow2);outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--pink)}.inp.err{border-color:var(--bad)}
textarea.inp{padding:12px 14px;min-height:80px;resize:vertical}
.errm{color:var(--bad);font-size:13px;font-weight:600;margin-top:5px}
.hint{font-size:12.5px;color:var(--muted);margin-top:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=range]{width:100%;height:44px;accent-color:var(--pink);background:transparent}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px}
.sw{position:relative;width:54px;height:32px;border-radius:16px;background:var(--chip);flex:none;transition:.2s}.sw::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.2)}.sw.on{background:var(--pink)}.sw.on::after{transform:translateX(22px)}
.photoBox{aspect-ratio:1;max-width:220px;margin:0 auto;border-radius:28px;background:var(--card2);border:2px dashed var(--chip);display:grid;place-items:center;overflow:hidden;position:relative;color:var(--ink2);text-align:center}
.photoBox img{width:100%;height:100%;object-fit:contain;background:repeating-conic-gradient(var(--card) 0 25%,var(--card2) 0 50%) 50%/16px 16px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--chip);border-top-color:var(--pink);animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
/* progress */
.bar{height:12px;border-radius:8px;background:var(--card2);overflow:hidden}.bar>i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--pink2),var(--pink));transition:width .5s}
.bar.ok>i{background:var(--ok)}.bar.warn>i{background:var(--warn)}.bar.bad>i{background:var(--bad)}
.segs{display:flex;gap:4px}.segs i{flex:1;height:12px;border-radius:6px;background:var(--chip)}.segs i.on{background:linear-gradient(90deg,var(--pink2),var(--pink))}
.stat{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1}
.stepper{display:flex;align-items:center;justify-content:space-between;margin:8px 0}.stepper button{width:44px;height:44px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:var(--ink)}
details.card{padding:0}details.card>summary{list-style:none;min-height:52px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;font-weight:700;cursor:pointer}details.card>summary::-webkit-details-marker{display:none}details.card[open]>summary .ic{transform:rotate(180deg)}details.card .dd{padding:0 16px 16px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}.kv b{text-align:right;overflow-wrap:anywhere}
.abar{position:fixed;left:0;right:0;bottom:0;z-index:55;display:flex;justify-content:center;padding:0 12px calc(12px + env(safe-area-inset-bottom));pointer-events:none}
.abar>div{pointer-events:auto;width:min(100%,520px);display:grid;grid-template-columns:repeat(4,1fr);background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:28px;box-shadow:0 10px 30px rgba(107,91,149,.28);padding:6px}
.abar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;border-radius:20px;font-size:11px;font-weight:700;color:var(--ink2)}.abar button.on{background:var(--pinksoft);color:var(--ink)}
.list>*+*{margin-top:10px}
.prow{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:20px;padding:10px;box-shadow:var(--shadow2);width:100%;text-align:left}
.prow .th{width:56px;height:56px;border-radius:16px;background:var(--card2);overflow:hidden;flex:none;display:grid;place-items:center}.prow .th img{width:100%;height:100%;object-fit:cover}.prow .th img.cut{object-fit:contain;padding:5%}.prow .th .art{width:70%;height:70%}
.empty{text-align:center;padding:28px 10px}.empty p{margin:6px auto 0;max-width:280px;color:var(--ink2)}
.banner{background:linear-gradient(135deg,#FFD9C2,#FFB3BF 60%,#F08CA3);color:#4a1630;border-radius:28px;padding:18px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);width:100%;text-align:left;position:relative;overflow:hidden}
.banner .ft{width:84px;height:84px;border-radius:22px;background:rgba(255,255,255,.55);overflow:hidden;flex:none;display:grid;place-items:center;transform:rotate(4deg)}.banner .ft img{width:100%;height:100%;object-fit:cover}.banner .ft img.cut{object-fit:contain;padding:6%}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sbox{background:var(--card);border-radius:20px;padding:12px 6px;text-align:center;box-shadow:var(--shadow2)}.sbox b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.celeb{position:fixed;inset:0;z-index:70;background:linear-gradient(180deg,var(--pinksoft),var(--bg) 60%);overflow-y:auto;text-align:center;padding:calc(24px + env(safe-area-inset-top)) 20px 40px}
.celeb .inner{max-width:440px;margin:0 auto}
.pcheck{position:relative;width:150px;height:150px;margin:14px auto 8px}.pcheck .pi{width:100%;height:100%;border-radius:32px;background:var(--card);box-shadow:var(--shadow);overflow:hidden;display:grid;place-items:center;transform:rotate(-3deg)}.pcheck img{width:100%;height:100%;object-fit:cover}.pcheck img.cut{object-fit:contain;padding:6%}.pcheck .art{width:70%}
.pcheck .ck{position:absolute;right:-10px;bottom:-10px;width:46px;height:46px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;border:4px solid var(--bg)}
.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.ptile{position:relative;aspect-ratio:1;border-radius:20px;overflow:hidden;background:var(--card2);width:100%}.ptile img{width:100%;height:100%;object-fit:cover}.ptile span{position:absolute;left:6px;right:6px;bottom:6px;background:rgba(30,43,77,.72);color:#fff;font-size:11px;font-weight:700;padding:5px 8px;border-radius:12px;backdrop-filter:blur(6px)}
.sharecv{width:100%;border-radius:20px;box-shadow:var(--shadow);background:#fff}
.badge{text-align:center;padding:12px 6px;border-radius:20px;background:var(--card);box-shadow:var(--shadow2)}.badge.lock{opacity:.45;filter:grayscale(1)}.badge .em{font-size:30px}.badge b{display:block;font-size:12px;margin-top:2px}
.warnbar{background:var(--warnbg);color:#8a5200;border-radius:16px;padding:10px 14px;font-size:13px;font-weight:600}.dark .warnbar{color:#FFC76B}
.fade-in{animation:fade .3s}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (min-width:700px){.page .inner,.wrap{padding-left:28px;padding-right:28px}.chips,.basket{margin:0 -28px;padding-left:28px;padding-right:28px}}
</style>

<body>
<div id="app"><div id="view"></div></div>
<nav class="nav" id="nav" aria-label="Main"></nav>
<div id="pages"></div>
<div id="celeb"></div>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>
<canvas id="confetti" style="position:fixed;inset:0;pointer-events:none;z-index:120;width:100%;height:100%"></canvas>
<script>
'use strict';
/* =====================================================================
   PROJECT PAN — single-file offline-first makeup tracker
   Rename the app here (also edit <title>/manifest for the installed name)
   ===================================================================== */
const APP_NAME = 'Project Pan';
const TZ = 'Asia/Kolkata';
document.title = APP_NAME;

/* ---------- tiny helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const plural = (n, w, p) => `${n} ${n === 1 ? w : (p || w + 's')}`;

/* ---------- dates (all in Asia/Kolkata, day boundary at local midnight) ---------- */
const _fmtDay = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
const dayKey = ts => _fmtDay.format(ts);                 // "YYYY-MM-DD"
const today = () => dayKey(Date.now());
const dnum = k => { const [y, m, d] = k.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };
const fromNum = n => new Date(n * 864e5).toISOString().slice(0, 10);
const addDays = (k, n) => fromNum(dnum(k) + n);
const addMonths = (k, n) => {
  const [y, m, d] = k.split('-').map(Number);
  const t = new Date(Date.UTC(y, m - 1 + n, 1));
  const last = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate();
  return fromNum(Math.round(Date.UTC(t.getUTCFullYear(), t.getUTCMonth(), Math.min(d, last)) / 864e5));
};
const diffDays = (a, b) => dnum(a) - dnum(b);
const validDate = k => /^\d{4}-\d{2}-\d{2}$/.test(k || '') && !isNaN(Date.parse(k + 'T00:00:00Z'));

/* =====================================================================
   STORAGE — IndexedDB first, localStorage fallback. Never throws.
   State JSON lives in store "kv"; photos live in store "img" (id -> dataURL)
   ===================================================================== */
const Store = {
  db: null, mode: 'idb', warned: false,
  async init() {
    try {
      if (!('indexedDB' in window)) throw new Error('no idb');
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('project-pan', 1);
        r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('kv'); d.createObjectStore('img'); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
      });
    } catch (e) { this.mode = 'ls'; this.db = null; }
  },
  _tx(store, mode, fn) {
    return new Promise(res => {
      try {
        const t = this.db.transaction(store, mode); const os = t.objectStore(store); let out;
        const r = fn(os); if (r) r.onsuccess = () => { out = r.result; };
        t.oncomplete = () => res({ ok: true, v: out }); t.onerror = t.onabort = () => res({ ok: false });
      } catch (e) { res({ ok: false }); }
    });
  },
  async get(store, key) {
    try {
      if (this.mode === 'idb') { const r = await this._tx(store, 'readonly', os => os.get(key)); return r.ok ? r.v ?? null : null; }
      const v = localStorage.getItem(`pp_${store}_${key}`); return v == null ? null : (store === 'kv' ? JSON.parse(v) : v);
    } catch (e) { return null; }
  },
  async set(store, key, val) {
    try {
      if (this.mode === 'idb') { const r = await this._tx(store, 'readwrite', os => os.put(val, key)); if (!r.ok) throw new Error('write'); return true; }
      localStorage.setItem(`pp_${store}_${key}`, store === 'kv' ? JSON.stringify(val) : val); return true;
    } catch (e) { this.fail(); return false; }
  },
  async del(store, key) {
    try {
      if (this.mode === 'idb') { await this._tx(store, 'readwrite', os => os.delete(key)); return; }
      localStorage.removeItem(`pp_${store}_${key}`);
    } catch (e) { /* ignore */ }
  },
  async all(store) {
    const out = {};
    try {
      if (this.mode === 'idb') {
        await new Promise(res => {
          try {
            const t = this.db.transaction(store, 'readonly'); const c = t.objectStore(store).openCursor();
            c.onsuccess = () => { const cur = c.result; if (cur) { out[cur.key] = cur.value; cur.continue(); } };
            t.oncomplete = t.onerror = t.onabort = () => res();
          } catch (e) { res(); }
        });
      } else {
        for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(`pp_${store}_`)) out[k.slice(store.length + 4)] = localStorage.getItem(k); }
      }
    } catch (e) { /* ignore */ }
    return out;
  },
  fail() { if (!this.warned) { this.warned = true; toast('Couldn’t save — storage may be full. Try exporting a backup.'); } setTimeout(() => { this.warned = false; }, 8000); },
  async usage() {
    try { if (navigator.storage && navigator.storage.estimate) { const e = await navigator.storage.estimate(); if (e.quota) return { used: e.usage, quota: e.quota }; } } catch (e) { /* ignore */ }
    return null;
  },
};

    return {
      id: p.id, name: str(p.name, 'Untitled').slice(0, 120) || 'Untitled', brand: str(p.brand).slice(0, 80), cat: str(p.cat, 'Other') || 'Other',
      price: num(p.price), shade: str(p.shade).slice(0, 80), finish: str(p.finish).slice(0, 40), expected: Math.max(1, Math.round(num(p.expected, 60))),
      img: str(p.img) || null, bgRemoved: !!p.bgRemoved, where: str(p.where).slice(0, 80), bought: date(p.bought), gift: !!p.gift,
      opened: date(p.opened), openedApprox: !!p.openedApprox, pao: num(p.pao), startDate: date(p.startDate), startAuto: !!p.startAuto, finishDate: date(p.finishDate),
      status: ['active', 'finished', 'archived'].includes(p.status) ? p.status : 'active', inUse: !!p.inUse, partly: !!p.partly,
      pctBase: clamp(num(p.pctBase, 100), 0, 100), baseLogs: clamp(Math.round(num(p.baseLogs, 0)), 0, logs.length), estPast: Math.max(0, Math.round(num(p.estPast, 0))),
      fav: !!p.fav, added: num(p.added, Date.now()), logs, verdict: ['yes', 'maybe', 'no'].includes(p.verdict) ? p.verdict : null, note: str(p.note).slice(0, 300), sample: !!p.sample,
      photos: (Array.isArray(p.photos) ? p.photos : []).filter(x => x && typeof x.img === 'string').map(x => ({ id: str(x.id) || uid(), img: x.img, ts: num(x.ts, Date.now()), uses: Math.max(0, Math.round(num(x.uses, 0))), pct: clamp(Math.round(num(x.pct, 0)), 0, 100) })),
    };
  });
  const ids = new Set(n.products.map(p => p.id));
  n.basket = (Array.isArray(raw.basket) ? raw.basket : []).filter(id => ids.has(id));
  n.projectIds = (Array.isArray(raw.projectIds) ? raw.projectIds : []).filter(id => ids.has(id));
  n.wishlist = (Array.isArray(raw.wishlist) ? raw.wishlist : []).filter(w => w && typeof w.id === 'string' && typeof w.name === 'string').map(w => ({ id: w.id, name: w.name.slice(0, 120), price: num(w.price), link: str(w.link).slice(0, 300), img: str(w.img) || null, added: num(w.added, Date.now()), sample: !!w.sample }));

  n.resets = (Array.isArray(raw.resets) ? raw.resets : []).filter(validDate);
  n.badgesSeen = (Array.isArray(raw.badgesSeen) ? raw.badgesSeen : []).filter(x => typeof x === 'string');
  return n;
}

   ===================================================================== */
const byId = id => S.products.find(p => p.id === id);
const activeProducts = () => S.products.filter(p => p.status === 'active');
const finishedProducts = () => S.products.filter(p => p.status === 'finished');
const src = id => (id && IMG[id]) || '';
const loggedUses = p => p.logs.length;
const totalUses = p => (p.estPast || 0) + p.logs.length;           // estimated past + logged in app
const expectedUses = p => Math.max(1, Math.round(p.expected || 1));
/** uses remaining = uses implied by % left at last calibration, minus uses logged since. Never negative. */
const usesRemaining = p => Math.max(0, Math.round(expectedUses(p) * p.pctBase / 100) - (p.logs.length - p.baseLogs));
const pctLeft = p => clamp(Math.round(usesRemaining(p) / expectedUses(p) * 100), 0, 100);
const isEstimated = p => (p.estPast || 0) > 0;
function costPerUse(p) {
  if (p.price == null || !isFinite(p.price)) return null;
  const n = totalUses(p); if (n <= 0) return null;
  return p.price / n;
}
const cpuText = p => { const c = costPerUse(p); return c == null ? '—' : (isEstimated(p) ? '~' : '') + inr(c, 2); };
function logsInLastDays(p, days) { const cut = addDays(today(), -(days - 1)); return p.logs.filter(l => l.day >= cut); }
/** Estimated finish uses ONLY uses logged in the app during the last 30 days. */
function estFinish(p) {
  const rem = usesRemaining(p);
  if (rem === 0) return { state: 'done' };
  const recent = logsInLastDays(p, 30);
  if (recent.length < 3) return { state: 'need' };
  const first = recent[0].day;
  const span = clamp(diffDays(today(), first) + 1, 7, 30);
  const perDay = recent.length / span;
  const days = Math.ceil(rem / perDay);
  if (!isFinite(days) || days > 3650) return { state: 'need' };
  return { state: 'ok', date: addDays(today(), days), days };
}
const estText = p => { const e = estFinish(p); return e.state === 'ok' ? fmtDate(e.date, true) : e.state === 'done' ? 'Almost there' : '—'; };
function expiryInfo(p) {
  if (!p.opened || !p.pao) return null;
  const exp = addMonths(p.opened, p.pao);
  const left = diffDays(exp, today());
  const span = Math.max(1, diffDays(exp, p.opened));
  const pctUsed = clamp((1 - left / span) * 100, 0, 100);
  const cls = left < 0 ? 'bad' : left <= 30 ? 'warn' : 'ok';
  let text;
  if (left < 0) text = `Expired ${plural(-left, 'day')} ago`;
  else if (left === 0) text = 'Expires today';
  else if (left < 60) text = `${plural(left, 'day')} left`;
  else text = `${plural(Math.round(left / 30.4), 'month')} left`;
  return { exp, left, cls, text, pctUsed, soon: left <= 30 };
}
function daysLasted(p) {
  if (!p.finishDate) return null;
  const start = p.startDate || dayKey(p.added);
  return Math.max(1, diffDays(p.finishDate, start) + 1);
}
const usesToday = p => p.logs.filter(l => l.day === today()).length;

/** Suggested expected uses from my finished (not partly tracked) products in the same category. */
function suggestExpected(cat, excludeId) {
  const fin = finishedProducts().filter(p => p.cat === cat && !p.partly && p.id !== excludeId && p.logs.length > 0);
  if (fin.length) return { n: Math.max(1, Math.round(fin.reduce((a, p) => a + p.logs.length, 0) / fin.length)), from: fin.length };
  return { n: CAT_DEFAULT_USES[cat] || 60, from: 0 };
}

/* streaks (only uses logged in the app) */
function logDays() { const set = new Set(); S.products.forEach(p => p.logs.forEach(l => set.add(l.day))); return [...set].sort(); }
function streaks() {
  const days = logDays(); if (!days.length) return { cur: 0, best: 0 };
  let best = 1, run = 1;
  for (let i = 1; i < days.length; i++) { run = diffDays(days[i], days[i - 1]) === 1 ? run + 1 : 1; best = Math.max(best, run); }
  const set = new Set(days); let cur = 0; let d = today();
  if (!set.has(d)) d = addDays(d, -1);
  while (set.has(d)) { cur++; d = addDays(d, -1); }
  return { cur, best };
}
const statsForBadges = () => ({ fin: finishedProducts().length, best: streaks().best, logs: S.products.reduce((a, p) => a + p.logs.length, 0) });
const earnedBadges = () => { const st = statsForBadges(); return BADGES.filter(b => b.test(st)); };

/* challenges */
function challengeProgress(c) { return finishedProducts().filter(p => p.finishDate && p.finishDate >= c.start && p.finishDate <= c.end).length; }
function currentChallenge() {
  const t = today();
  const act = S.challenges.filter(c => c.end >= t && c.start <= t && challengeProgress(c) < c.target).sort((a, b) => a.end.localeCompare(b.end));
  return act[0] || null;
}

/* no-buy tracker: last purchase date from products (gifts excluded) + manual resets */
function noBuy() {
  const t = today();
  const ev = new Set([S.settings.started, ...S.resets]);
  S.products.forEach(p => { if (p.bought && !p.gift && p.bought <= t) ev.add(p.bought); });
  const arr = [...ev].filter(d => d <= t).sort(); arr.push(t);
  let best = 0; for (let i = 1; i < arr.length; i++) best = Math.max(best, diffDays(arr[i], arr[i - 1]));
  const last = arr[arr.length - 2];
  return { days: Math.max(0, diffDays(t, last)), best: Math.max(best, 0), last };
}

/* ---------------- MONTHLY RECAP ---------------- */
function monthStats(mk = monthKey(today())) {
  const prods = S.products.filter(p => p.status !== 'archived');
  const used = prods.filter(p => p.status === 'active').filter(p => p.logs.some(l => monthKey(l.day) === mk));
  const fin = finishedProducts().filter(p => p.finishDate && monthKey(p.finishDate) === mk);
  let most = null, mc = 0; prods.forEach(p => { const c = p.logs.filter(l => monthKey(l.day) === mk).length; if (c > mc) { mc = c; most = p; } });
  const days = [...new Set(S.products.flatMap(p => p.logs.filter(l => monthKey(l.day) === mk).map(l => l.day)))].sort();
  let best = days.length ? 1 : 0, run = 1; for (let i = 1; i < days.length; i++) { run = diffDays(days[i], days[i - 1]) === 1 ? run + 1 : 1; best = Math.max(best, run); }
  const label = new Date(mk + '-01T00:00:00Z').toLocaleDateString('en-IN', { timeZone: 'UTC', month: 'long', year: 'numeric' });
  return { mk, label, used: used.length, total: activeProducts().length, fin, most, mc, best };
}
function recapPage() {
  const m = monthStats();

function logUse(id) {
  const p = byId(id); if (!p || p.status !== 'active') return false;
  const l = { id: uid(), ts: Date.now(), day: today() };
  p.logs.push(l); p.logs.sort((a, b) => a.ts - b.ts);
  if (!p.startDate) { p.startDate = l.day; p.startAuto = true; }
  lastLogs.push({ pid: id, lid: l.id }); if (lastLogs.length > 40) lastLogs.shift();
  save(); haptic(); render();
  burstAt($(`.bcard[data-bid="${id}"]`) || $('#usedCard'));
  const nb = checkBadges();
  toast('Logged ✨' + (nb ? ' · New badge ' + nb + '!' : ''), true);
  return true;
}
function removeLog(p, lid) {
  const i = p.logs.findIndex(l => l.id === lid); if (i < 0) return false;
  p.logs.splice(i, 1);
  if (i < p.baseLogs) p.baseLogs = Math.max(0, p.baseLogs - 1);
  p.baseLogs = Math.min(p.baseLogs, p.logs.length);
  if (!p.logs.length && p.startAuto) { p.startDate = null; p.startAuto = false; }
  return true;
}
function undoLast() {
  while (lastLogs.length) {
    const { pid, lid } = lastLogs.pop(); const p = byId(pid);
    if (p && removeLog(p, lid)) { save(); render(); toast('Undone'); return; }
  }
  toast('Nothing to undo');
}

/** Set % left (recalibrate). Keeps estimated past uses consistent with the new % left. */
function recalibrate(p, pct, pastUses) {
  p.pctBase = clamp(Math.round(pct), 0, 100); p.baseLogs = p.logs.length;
  const usedTotal = Math.round(expectedUses(p) * (1 - p.pctBase / 100));
  p.estPast = pastUses != null ? Math.max(0, Math.round(pastUses)) : Math.max(0, usedTotal - p.logs.length);
  if (p.estPast > 0) p.partly = true;
}

function finishProduct(id) {
  const p = byId(id); if (!p || p.status !== 'active') return;
  p.status = 'finished'; p.finishDate = today(); p.pctBase = 0; p.baseLogs = p.logs.length;
  if (!p.startDate) p.startDate = p.finishDate;
  S.basket = S.basket.filter(x => x !== id); save(); haptic(30); checkBadges(); render();

}
function restoreProduct(id) {
  const p = byId(id); if (!p) return;

/* ---------- image helpers ---------- */
async function compressImage(file, max = 720, alpha = false) {
  let bmp;
  try { bmp = await createImageBitmap(file); } catch (e) {
    bmp = await new Promise((res, rej) => { const u = URL.createObjectURL(file); const i = new Image(); i.onload = () => { URL.revokeObjectURL(u); res(i); }; i.onerror = () => rej(new Error('img')); i.src = u; });
  }
  const w = bmp.width || bmp.naturalWidth, h = bmp.height || bmp.naturalHeight;
  if (!w || !h) throw new Error('empty image');
  const s = Math.min(1, max / Math.max(w, h)), cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(w * s)); cv.height = Math.max(1, Math.round(h * s));
  const ctx = cv.getContext('2d');
  if (!alpha) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); }
  ctx.drawImage(bmp, 0, 0, cv.width, cv.height); if (bmp.close) bmp.close();
  if (alpha) { const d = cv.toDataURL('image/webp', .85); return d.startsWith('data:image/webp') ? d : cv.toDataURL('image/png'); }
  return cv.toDataURL('image/jpeg', .82);
}
const withTimeout = (pr, ms) => Promise.race([pr, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);

async function handleFormFile(file) {
  const F = UI.form; if (!file || !F) return;
  if (!/^image\//.test(file.type)) { F.err.img = 'Please choose an image file.'; render(); return; }
  F.busy = 'img'; delete F.err.img; render();
  try { const d = await compressImage(file, 720, false); if (UI.form !== F) return; F.imgData = d; F.origData = d; F.bgRemoved = false; F.dirty = true; }
  catch (e) { F.err.img = 'Couldn’t read that photo. Please try another one.'; }
  F.busy = ''; render();
}
async function removeBgAction() {
  const F = UI.form; if (!F || F.busy) return;
  const source = F.imgData || src(F.imgId); if (!source) return;
  F.busy = 'bg'; render();
  try {
    const mod = await withTimeout(import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm'), 30000);
    const fn = mod.removeBackground || (mod.default && mod.default.removeBackground) || mod.default;
    const blob = await (await fetch(source)).blob();
    const out = await withTimeout(fn(blob, { output: { format: 'image/png' } }), 150000);
    const d = await compressImage(out, 720, true);
    if (UI.form !== F) return; F.origData = source; F.imgData = d; F.bgRemoved = true; F.dirty = true; toast('Background removed ✨');
  } catch (e) { if (UI.form === F) toast('Couldn’t remove the background — keeping your original photo.'); }
  if (UI.form === F) { F.busy = ''; render(); }
}

    const used = {}; Object.keys(IMG).forEach(id => { used[id] = IMG[id]; });
    const blob = new Blob([JSON.stringify({ app: APP_NAME, version: 1, exportedAt: new Date().toISOString(), state: S, images: used })], { type: 'application/json' });
    downloadBlob(blob, `project-pan-backup-${today()}.json`); toast('Backup exported ✨');
  } catch (e) { toast('Couldn’t export — your data may be too large for one file.'); }
}
const csvCell = v => { let s = v == null ? '' : String(v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function exportCsv(kind) {
  let rows;
  if (kind === 'logs') { rows = [['product_id', 'product_name', 'date', 'timestamp']]; S.products.forEach(p => p.logs.forEach(l => rows.push([p.id, p.name, l.day, new Date(l.ts).toISOString()]))); }
  else {
    rows = [['id', 'name', 'brand', 'category', 'status', 'price_inr', 'shade', 'finish', 'expected_uses', 'estimated_past_uses', 'logged_uses', 'cost_per_use_inr', 'estimated_cost_per_use', 'percent_left', 'where_bought', 'date_bought', 'gift', 'date_opened', 'pao_months', 'expiry_date', 'start_date', 'finish_date', 'repurchase', 'note']];
    S.products.forEach(p => { const e = expiryInfo(p), c = costPerUse(p); rows.push([p.id, p.name, p.brand, p.cat, p.status, p.price, p.shade, p.finish, p.expected, p.estPast, p.logs.length, c == null ? '' : c.toFixed(2), isEstimated(p) ? 'yes' : 'no', pctLeft(p), p.where, p.bought, p.gift ? 'yes' : 'no', p.opened, p.pao, e ? e.exp : '', p.startDate, p.finishDate, p.verdict, p.note]); });
  }
  downloadBlob(new Blob(['﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' }), `project-pan-${kind}-${today()}.csv`); toast('CSV exported ✨');
}
async function importFile(file) {
  try {
    if (file.size > 250 * 1024 * 1024) throw new Error('too big');
    const obj = JSON.parse(await file.text());
    const raw = obj && obj.state ? obj.state : obj;
    const n = normalize(raw); if (!n) throw new Error('not a backup');
    const imgs = {}; const im = obj && obj.images && typeof obj.images === 'object' ? obj.images : {};
    Object.keys(im).forEach(k => { if (typeof im[k] === 'string' && /^data:image\/(png|jpe?g|webp|gif);base64,/.test(im[k])) imgs[k] = im[k]; });
    const photos = n.products.reduce((a, p) => a + p.photos.length, 0);
    sheet(`<h2>Replace everything?</h2><p class="muted">This backup has <b>${plural(n.products.length, 'product')}</b>, ${plural(n.products.reduce((a, p) => a + p.logs.length, 0), 'logged use')}, ${plural(photos, 'progress photo')} and ${plural(Object.keys(imgs).length, 'image')}.<br><br>Your current data (${plural(S.products.length, 'product')}) will be <b>replaced</b>. Export a backup first if you’re unsure.</p><div class="row mt16"><button class="btn ghost grow" data-act="closeSheet">Cancel</button><button class="btn danger grow" data-act="importGo">Replace</button></div>`);
    ACT.importGo = async () => {
      const oldS = S, oldI = IMG; closeSheet();
      try {
        S = n; IMG = imgs; S.badgesSeen = [...new Set([...S.badgesSeen, ...earnedBadges().map(b => b.id)])];
        for (const id of Object.keys(oldI)) await Store.del('img', id);
        for (const id of Object.keys(imgs)) { if (!(await Store.set('img', id, imgs[id]))) throw new Error('write'); }
        if (!(await Store.set('kv', 'state', S))) throw new Error('write');
        UI.stack = []; UI.form = null; UI.cat = 'All'; render(); toast('Backup imported 💖');
      } catch (e) { S = oldS; IMG = oldI; await saveNow(); for (const id of Object.keys(oldI)) await Store.set('img', id, oldI[id]); render(); toast('Import failed — your original data is untouched.'); }
    };
  } catch (e) { toast('That file doesn’t look like a ' + APP_NAME + ' backup.'); }
}

  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const t = today(), mk = (o, uses, span, fin) => {
    const p = Object.assign({ id: uid(), brand: '', shade: '', finish: '', price: null, where: '', bought: null, gift: false, opened: null, openedApprox: false, pao: null, startDate: null, startAuto: false, finishDate: null, status: 'active', inUse: false, partly: false, pctBase: 100, baseLogs: 0, estPast: 0, fav: false, added: Date.now() - (span + 5) * 864e5, logs: [], photos: [], verdict: null, note: '', sample: true, img: null, bgRemoved: false }, o);

    if (o.today) days.add(t);
    [...days].sort().forEach(d => { const k = 1 + (rnd() > .85 ? 1 : 0); for (let i = 0; i < k && p.logs.length < uses; i++) p.logs.push({ id: uid(), ts: Date.parse(d + 'T05:00:00Z') + (p.logs.length % 7) * 90000, day: d }); });
    if (o.today && !p.logs.some(l => l.day === t)) { if (p.logs.length >= uses) p.logs.pop(); p.logs.push({ id: uid(), ts: Date.parse(t + 'T05:00:00Z'), day: t }); }
    p.logs.sort((a, b) => a.ts - b.ts);
    if (p.logs.length) { p.startDate = p.logs[0].day; p.startAuto = true; }

    mk({ name: 'Vitamin C Serum', brand: 'Minimalist', cat: 'Skincare', price: 699, expected: 60, opened: addDays(t, -160), pao: 6, today: true, bought: addDays(t, -170), where: 'Nykaa' }, 40, 55),
    mk({ name: 'Fluffy Blending Brush', brand: 'Real Techniques', cat: 'Tools', price: 1200, expected: 300, fav: true }, 44, 50),
    mk({ name: 'Eyeshadow Palette', brand: 'Huda Beauty', cat: 'Eyes', price: 4900, expected: 120, finish: 'Shimmer', fav: true }, 22, 45),
    mk({ name: 'Tinted Moisturiser', brand: 'Bobbi Brown', cat: 'Face', price: 2800, expected: 90, opened: addDays(addMonths(t, -12), 10), pao: 12 }, 20, 25),
    mk({ name: 'Hydrating Lip Balm', brand: 'Laneige', cat: 'Lips', price: 1500, expected: 55, finish: 'Dewy', opened: addDays(t, -200), pao: 12 }, 49, 80, 20),
    mk({ name: 'Mini Mascara', brand: 'Maybelline', cat: 'Eyes', price: 599, expected: 70, bought: addDays(t, -120) }, 61, 90, 33),
    mk({ name: 'Setting Powder', brand: 'Laura Mercier', cat: 'Face', price: 3900, expected: 150, finish: 'Matte' }, 120, 160, 40),
    mk({ name: 'Cream Bronzer', brand: 'Fenty', cat: 'Cheeks', price: 2900, expected: 70, finish: 'Satin' }, 55, 100, 9),
  ];
  const v = ['yes', 'maybe', 'no', 'yes']; list.filter(p => p.status === 'finished').forEach((p, i) => { p.verdict = v[i % 4]; });

function clearSample() {
  const ids = new Set(S.products.filter(p => p.sample).map(p => p.id));
  S.products = S.products.filter(p => !p.sample); S.basket = S.basket.filter(i => !ids.has(i)); S.projectIds = S.projectIds.filter(i => !ids.has(i));
  S.wishlist = S.wishlist.filter(w => !w.sample); S.challenges = S.challenges.filter(c => !c.sample); lastLogs = []; gcImages(); save(); render(); toast('Demo data cleared');

/* ---------- storage warning ---------- */
async function checkStorage() {
  const u = await Store.usage(), box = $('#storeWarn'); if (!u || !box) return;
  const pct = u.used / u.quota;
  if (pct > .8) box.innerHTML = `<div class="warnbar mt12">Storage is ${Math.round(pct * 100)}% full. Export a backup and consider removing old progress photos.</div>`;
}

/* ---------- init ---------- */
let lastDay = today();
setInterval(() => { if (today() !== lastDay) { lastDay = today(); render(); } }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && today() !== lastDay) { lastDay = today(); render(); } });
const _render = render; render = function () { _render(); if (UI.tab === 'profile' && !UI.stack.length) checkStorage(); };

(async function init() {
  await Store.init();
  const raw = await Store.get('kv', 'state'), n = normalize(raw);
  if (n) S = n; else if (raw) { await Store.set('kv', 'state_backup', raw); toast('Your saved data looked damaged, so it was set aside safely.'); }
  const imgs = await Store.all('img'); Object.keys(imgs).forEach(k => { if (typeof imgs[k] === 'string') IMG[k] = imgs[k]; });
  if (!raw) { S.settings.started = today(); await Store.set('kv', 'state', S); }
  if (!S.settings.started) S.settings.started = today();
  render();
  if (!S.settings.onboarded) { UI.celeb = { t: 'onb', step: 0 }; renderCeleb(); }
  try { if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { /* optional */ }); } catch (e) { /* ignore */ }
  try { history.replaceState({ d: 0 }, ''); } catch (e) { /* ignore */ }
  checkStorage().then(async () => { const u = await Store.usage(); if (u && u.used / u.quota > .8) toast('Storage is nearly full — export a backup in Profile.'); });
})();
